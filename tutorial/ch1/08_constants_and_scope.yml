fns:
  - &source_fn |
      fn on_init() {
        globals.seq = 0;
        log("[" + node_name + "] initialized with " + links.len() + " downstream link(s)");
      }
      fn on_timer() {
        if links.len() == 0 { return; }
        globals.seq += 1;
        // Dynamically route across links without hardcoding peer names
        let target = links[globals.seq % links.len()];
        log("[" + node_name + "] dispatching task #" + globals.seq + " to " + target);
        send(target, #{
          sender: node_name,
          task_id: globals.seq,
          display: "task #" + globals.seq + " from " + node_name
        });
      }
      fn on_msg(msg) {
        if msg.type == "ACK" {
          log("[" + node_name + "] task #" + msg.task_id + " completed by " + msg.worker);
        }
      }

  - &worker_fn |
      fn on_init() {
        globals.processed = 0;
        globals.history = [];
        log("[" + node_name + "] ready for work");
      }
      fn on_msg(msg) {
        globals.processed += 1;
        globals.history.push(msg.task_id);
        log("[" + node_name + "] processed " + globals.processed + " total task(s). Current: #" + msg.task_id);
        send(msg.from, #{
          type: "ACK",
          task_id: msg.task_id,
          worker: node_name,
          total_done: globals.processed,
          display: "ACK from " + node_name
        });
      }

graph_defn:
  graph_attrs:
    title: Built-in Constants & State Persistence
  graph:
    - name: orchestrator
      node_type: source
      links: [worker_alpha, worker_beta]
    - name: worker_alpha
      node_type: worker
      links: []
    - name: worker_beta
      node_type: worker
      links: []

  node_types:
    - id: source
      attrs:
        ticks: 4
      fn: *source_fn
    - id: worker
      attrs:
        ticks: 3600
      fn: *worker_fn
