imports:
  - from: "plibs:themes/nordic"
  - from: "plibs:aws/compute"

fns:
  - &client_fn |
    fn on_init() {
      globals.count = 0;
      log("Client initialized in Nordic theme");
    }
    fn on_timer() {
      globals.count += 1;
      if globals.count <= 3 {
        send("lambda_exec", #{ action: "process_job", id: globals.count });
        explain(
          "nordic_intro",
          "This client node dispatches jobs to an AWS Lambda function imported from **`plibs:aws/compute`**."
        );
      }
    }
    fn on_message(from_node, msg) {
      log("Client received result from " + from_node + ": " + msg);
    }

graph_defn:
  graph_attrs:
    title: "Intro to plibs - Nordic & AWS Compute"
  node_types:
    - id: client
      fn: *client_fn
      attrs:
        ticks: 2
  graph:
    - name: client
      node_type: client
      links: [lambda_exec]
    - name: lambda_exec
      node_type: lambda_func
      links: [client]
