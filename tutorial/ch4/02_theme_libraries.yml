imports:
  - from: "plibs:themes/dracula"

fns:
  - &producer_fn |
    fn on_init() {
      globals.id = 0;
      log("Dracula producer initialized");
    }
    fn on_timer() {
      globals.id += 1;
      if globals.id <= 3 {
        send("broker", #{ payload: "item_" + globals.id });
        explain(
          "dracula_intro",
          "Notice the purple/pink palette, chamfered message bubbles, and Dracula explain dialog!"
        );
      }
    }

  - &broker_fn |
    fn on_message(from_node, msg) {
      log("Broker received " + msg + " from " + from_node);
      send("consumer", #{ status: "dispatched", data: msg });
    }

  - &consumer_fn |
    fn on_message(from_node, msg) {
      log("Consumer processed " + msg + " from " + from_node);
    }

graph_defn:
  graph_attrs:
    title: "Dracula Theme Showcase"
  node_types:
    - id: dracula_producer
      template: dracula_node
      fn: *producer_fn
      attrs:
        ticks: 2
        title: "PRODUCER"
        status: "ACTIVE"
        badge: "BATCH"
    - id: dracula_broker
      template: dracula_node
      fn: *broker_fn
      attrs:
        title: "BROKER"
        status: "READY"
        badge: "QUEUE"
    - id: dracula_consumer
      template: dracula_node
      fn: *consumer_fn
      attrs:
        title: "CONSUMER"
        status: "LISTENING"
        badge: "WORKER"
  graph:
    - name: producer
      node_type: dracula_producer
      links: [broker]
    - name: broker
      node_type: dracula_broker
      links: [consumer]
    - name: consumer
      node_type: dracula_consumer
      links: []
