imports:
  - from: "themes:cloud"

graph_defn:
  layout:
    type: hierarchical
    direction: lr
    rank_sep: 220
    node_sep: 110
  graph_attrs:
    title: "Layered & Composed Themes"
    connection_color: "#6366f1"
  node_types:
    - id: source
      attrs: { ticks: 4 }
    - id: destination
      attrs: { ticks: 3600 }
  graph:
    - name: source_node
      node_type: source
      links: [dest_node]
    - name: dest_node
      node_type: destination
      links: []
