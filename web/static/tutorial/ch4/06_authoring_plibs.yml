imports:
  - from: "plibs:themes/cyberpunk"

node_templates:
  - id: custom_waf_card
    width: 150
    height: 70
    draw: |
      draw_rect(0, 0, width, height, #{ fill: "#0d1b2a", stroke: "#00F0FF", stroke_width: 2, rx: 6 });
      draw_rect(0, 0, width, 22, #{ fill: "#1b263b", stroke: "#00F0FF", stroke_width: 1, rx: 6 });
      draw_text(10, 15, attrs.title, #{ fill: "#00F0FF", font_size: 11, font_weight: "bold" });
      draw_text(10, 42, "BLOCKED: " + state.blocked, #{ fill: "#FF007F", font_size: 10, font_weight: "bold" });
      draw_text(10, 58, "PASSED:  " + state.passed, #{ fill: "#00FF66", font_size: 10, font_weight: "bold" });

fns:
  - &client_source_fn |
    fn on_init() {
      state.pkt = 0;
    }
    fn on_timer() {
      state.pkt += 1;
      if state.pkt <= 4 {
        let is_malicious = (state.pkt % 2 == 0);
        send("waf_shield", #{ id: state.pkt, malicious: is_malicious });
        explain(
          "Custom Library Node Demo",
          "Client sending packet #" + state.pkt + " (malicious=" + is_malicious + ") to Custom WAF Shield.",
          #{ pause: true }
        );
      }
    }

  - &waf_fn |
    fn on_init() {
      state.blocked = 0;
      state.passed = 0;
    }
    fn on_message(from_node, msg) {
      if msg.malicious {
        state.blocked += 1;
        log("WAF BLOCKED malicious packet #" + msg.id);
      } else {
        state.passed += 1;
        log("WAF PASSED clean packet #" + msg.id);
        send_all(msg);
      }
    }

  - &backend_fn |
    fn on_message(from_node, msg) {
      log("Protected backend received verified packet #" + msg.id);
    }

graph_defn:
  graph_attrs:
    title: "Custom Security Library (WAF & Filter)"
  node_types:
    - id: traffic_src
      template: custom_waf_card
      fn: *client_source_fn
      attrs:
        ticks: 2
        title: "TRAFFIC INGRESS"
    - id: waf_shield
      template: custom_waf_card
      fn: *waf_fn
      attrs:
        title: "CYBER WAF SHIELD"
    - id: secure_backend
      template: custom_waf_card
      fn: *backend_fn
      attrs:
        title: "SECURE BACKEND"
  graph:
    - name: ingress
      node_type: traffic_src
      links: [waf_shield]
    - name: waf_shield
      node_type: waf_shield
      links: [secure_backend]
    - name: secure_backend
      node_type: secure_backend
      links: []
