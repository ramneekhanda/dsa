imports:
  - from: "plibs:themes/cloud"
  - from: "plibs:aws/compute"
  - from: "plibs:aws/networking"

fns:
  - &traffic_gen_fn |
    fn on_init() {
      globals.req_id = 0;
    }
    fn on_timer() {
      globals.req_id += 1;
      if globals.req_id <= 4 {
        send("edge_cdn", #{ path: "/api/orders", req: globals.req_id });
        explain(
          "ingress_demo",
          "Traffic generator sending HTTP request #" + globals.req_id + " to CloudFront CDN and API Gateway."
        );
      }
    }

graph_defn:
  graph_attrs:
    title: "AWS Compute & Networking Architecture"
  node_types:
    - id: traffic_gen
      attrs:
        ticks: 2
        template_ref: cloud_card
        params:
          icon: "aws_alb"
          accent_color: "#0284c7"
          role: "Load Tester"
          status_bg: "#eff6ff"
          status_color: "#1d4ed8"
          status_text: "4 SESSIONS // ACTIVE"
      fn: *traffic_gen_fn
  graph:
    - name: client
      node_type: traffic_gen
      links: [edge_cdn]
    - name: edge_cdn
      node_type: cloudfront
      links: [api_gw]
    - name: api_gw
      node_type: api_gateway
      links: [order_lambda, user_ecs]
    - name: order_lambda
      node_type: lambda_func
      links: []
    - name: user_ecs
      node_type: ecs_service
      links: []
