imports:
  - from: "plibs:themes/cloud"
  - from: "plibs:aws/compute"
  - from: "plibs:aws/networking"

fns:
  - &traffic_gen_fn |
    fn on_init() {
      state.req_id = 0;
    }
    fn on_timer() {
      state.req_id += 1;
      if state.req_id <= 4 {
        send("edge_cdn", #{ path: "/api/orders", req: state.req_id });
        explain(
          "AWS Edge & Compute Ingress",
          "Traffic generator sending HTTP request #" + state.req_id + " to CloudFront CDN and API Gateway.",
          #{ pause: true }
        );
      }
    }

graph_defn:
  graph_attrs:
    title: "AWS Compute & Networking Architecture"
  node_types:
    - id: traffic_gen
      template: aws_alb_card
      fn: *traffic_gen_fn
      attrs:
        ticks: 2
        title: "TRAFFIC GEN"
        status: "GENERATING"
        target_count: "4 users"
  graph:
    - name: client
      node_type: traffic_gen
      links: [edge_cdn]
    - name: edge_cdn
      node_type: cloudfront
      links: [api_gw]
    - name: api_gw
      node_type: api_gateway
      links: [order_lambda, user_ecs]
    - name: order_lambda
      node_type: lambda_func
      links: []
    - name: user_ecs
      node_type: ecs_service
      links: []
