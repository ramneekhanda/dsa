imports:
  - from: "plibs:themes/cloud"
  - from: "plibs:aws/all"

fns:
  - &user_client_fn |
    fn on_init() {
      globals.order_seq = 0;
    }
    fn on_timer() {
      globals.order_seq += 1;
      if globals.order_seq <= 3 {
        send("cf_cdn", #{ action: "checkout", cart_id: "CART-" + globals.order_seq, total: 149.99 });
        explain(
          "customer_checkout",
          "Customer submits checkout request #" + globals.order_seq + " routed through CloudFront CDN to API Gateway."
        );
      }
    }

graph_defn:
  graph_attrs:
    title: "Serverless E-Commerce System (plibs:aws/all)"
  node_types:
    - id: user_client
      template: aws_alb_card
      fn: *user_client_fn
      attrs:
        ticks: 2
        title: "WEB CLIENT"
        status: "ACTIVE"
        target_count: "3 orders"
  graph:
    - name: client
      node_type: user_client
      links: [cf_cdn]
    - name: cf_cdn
      node_type: cloudfront
      links: [api_gw]
    - name: api_gw
      node_type: api_gateway
      links: [order_lambda]
    - name: order_lambda
      node_type: lambda_func
      links: [orders_table, order_queue]
    - name: orders_table
      node_type: dynamodb
      links: []
    - name: order_queue
      node_type: sqs_queue
      links: [rds_cluster, s3_invoices]
    - name: rds_cluster
      node_type: rds_aurora
      links: []
    - name: s3_invoices
      node_type: s3_bucket
      links: []
