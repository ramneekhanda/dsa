imports:
  - from: "plibs:themes/cloud"
  - from: "plibs:aws/database"
  - from: "plibs:aws/messaging"

fns:
  - &event_source_fn |
    fn on_init() {
      state.id = 0;
    }
    fn on_timer() {
      state.id += 1;
      if state.id <= 3 {
        send("events", #{ event_type: "OrderPlaced", order_id: "ORD-" + state.id, amount: 99.0 });
        explain(
          "Event Driven Fan-out",
          "EventBridge receives OrderPlaced event #" + state.id + " and fans out to SQS and DynamoDB.",
          #{ pause: true }
        );
      }
    }

graph_defn:
  graph_attrs:
    title: "AWS Storage & Messaging Pipeline"
  node_types:
    - id: source
      template: aws_sns_card
      fn: *event_source_fn
      attrs:
        ticks: 2
        title: "ORDER SOURCE"
        status: "ACTIVE"
        sub_count: "3 events"
  graph:
    - name: source
      node_type: source
      links: [events]
    - name: events
      node_type: eventbridge
      links: [order_queue, order_db]
    - name: order_queue
      node_type: sqs_queue
      links: [s3_archive]
    - name: order_db
      node_type: dynamodb
      links: []
    - name: s3_archive
      node_type: s3_bucket
      links: []
