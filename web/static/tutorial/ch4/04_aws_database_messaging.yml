imports:
  - from: "plibs:themes/cloud"
  - from: "plibs:aws/database"
  - from: "plibs:aws/messaging"

fns:
  - &event_source_fn |
    fn on_init() {
      globals.id = 0;
    }
    fn on_timer() {
      globals.id += 1;
      if globals.id <= 3 {
        send("events", #{ event_type: "OrderPlaced", order_id: "ORD-" + globals.id, amount: 99.0 });
        explain(
          "event_fanout",
          "EventBridge receives OrderPlaced event #" + globals.id + " and fans out to SQS and DynamoDB."
        );
      }
    }

graph_defn:
  graph_attrs:
    title: "AWS Storage & Messaging Pipeline"
  node_types:
    - id: source
      attrs:
        ticks: 4
        template_ref: cloud_card
        params:
          icon: "aws_sns"
          accent_color: "#f43f5e"
          role: "Event Publisher"
          status_bg: "#fff1f2"
          status_color: "#be123c"
          status_text: "PUBLISHER // READY"
      fn: *event_source_fn
  graph:
    - name: source
      node_type: source
      links: [events]
    - name: events
      node_type: eventbridge
      links: [order_queue, order_db]
    - name: order_queue
      node_type: sqs_queue
      links: [s3_archive]
    - name: order_db
      node_type: dynamodb
      links: []
    - name: s3_archive
      node_type: s3_bucket
      links: []
