fns:
  - &pub_fn |
      fn on_init() {
        globals.event_id = 0;
      }
      fn on_timer() {
        globals.event_id += 1;
        send("broker", #{ event: globals.event_id, display: "EVENT #" + globals.event_id });
      }

  - &broker_fn |
      fn on_init() {}
      fn on_msg(msg) {
        send("consumer_analytics", #{ event: msg.event, display: "FANOUT" });
        send("consumer_alerts", #{ event: msg.event, display: "FANOUT" });
      }

  - &sub_fn |
      fn on_init() {}
      fn on_msg(msg) {}

graph_defn:
  graph:
    - name: ingress_pub
      node_type: producer
      links: [broker]
    - name: broker
      node_type: event_broker
      links: [consumer_analytics, consumer_alerts]
    - name: consumer_analytics
      node_type: analytics_consumer
      links: []
    - name: consumer_alerts
      node_type: alert_consumer
      links: []

  graph_attrs:
    title: Minimal Capsule Pills Theme

  icons:
    - id: pub_icon
      url: https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.1/assets/72x72/1f4e8.png
    - id: broker_icon
      url: https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.1/assets/72x72/1f504.png
    - id: chart_icon
      url: https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.1/assets/72x72/1f4ca.png
    - id: bell_icon
      url: https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.1/assets/72x72/1f514.png

  node_templates:
    - id: capsule_pill
      params: [node_name, icon, disc_color, role_tag, tag_color]
      shapes:
        # Outer pill container
        - shape: roundedrect
          x: 0
          y: 0
          w: 114
          h: 32
          radius: 16
          fill: "#ffffff"
          stroke: "#cbd5e1"
          stroke_width: 1.5

        # Left circular icon disc
        - shape: circle
          x: -41
          y: 0
          r: 12
          fill: "{{disc_color}}"
        - shape: icon
          x: -41
          y: 0
          w: 16
          h: 16
          icon: "{{icon}}"

        # Circular progress ring wrapping around the icon disc!
        - shape: progress
          style: ring
          x: -41
          y: 0
          r: 14.5
          thickness: 2
          track_color: "#e2e8f0"
          fill_color: "{{tag_color}}"
          start_angle: 90
          clockwise: true

        # Vertical divider line
        - shape: line
          x1: -24
          y1: 8
          x2: -24
          y2: -8
          stroke: "#e2e8f0"
          stroke_width: 1

        # Title text & role tag
        - shape: text
          x: 16
          y: 4
          text: "{{node_name}}"
          size: 9
          color: "#1e293b"
        - shape: text
          x: 16
          y: -6
          text: "{{role_tag}}"
          size: 7
          color: "{{tag_color}}"

  node_types:
    - id: producer
      fn: *pub_fn
      attrs:
        ticks: 2
        icon: pub_icon
        template_ref: capsule_pill
        template_params:
          node_name: "Web Ingress"
          disc_color: "#dbeafe"
          role_tag: "PUBLISHER"
          tag_color: "#2563eb"

    - id: event_broker
      fn: *broker_fn
      attrs:
        ticks: 3600
        icon: broker_icon
        template_ref: capsule_pill
        template_params:
          node_name: "Kafka Broker"
          disc_color: "#ede9fe"
          role_tag: "EVENT MESH"
          tag_color: "#7c3aed"

    - id: analytics_consumer
      fn: *sub_fn
      attrs:
        ticks: 3600
        icon: chart_icon
        template_ref: capsule_pill
        template_params:
          node_name: "Metrics Engine"
          disc_color: "#d1fae5"
          role_tag: "CONSUMER A"
          tag_color: "#059669"

    - id: alert_consumer
      fn: *sub_fn
      attrs:
        ticks: 3600
        icon: bell_icon
        template_ref: capsule_pill
        template_params:
          node_name: "PagerDuty Sync"
          disc_color: "#fef3c7"
          role_tag: "CONSUMER B"
          tag_color: "#d97706"
