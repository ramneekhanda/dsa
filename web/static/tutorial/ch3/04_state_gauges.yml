fns:
  - &client_fn |
    fn on_init() {
      globals.seq = 0;
    }
    fn on_timer() {
      globals.seq += 1;
      send("worker", #{ id: globals.seq });
    }

  - &worker_fn |
    fn on_init() {
      globals.queue = [];
      redraw_meter();
    }
    fn on_msg(msg) {
      globals.queue.push(msg.id);
      redraw_meter();
    }
    fn on_timer() {
      if globals.queue.len() > 0 {
        let item = globals.queue.remove(0);
        log("Worker processed item #" + item);
      }
      redraw_meter();
    }
    fn redraw_meter() {
      let count = globals.queue.len();
      let color = if count >= 3 { "#ef4444" } else if count > 0 { "#f59e0b" } else { "#10b981" };
      let bar_w = if count * 20 > 90 { 90.0 } else { (count * 20) * 1.0 };
      draw([
        #{ shape: "rect", w: 140, h: 60, radius: 8, bg: "#ffffff", border: color, border_width: 2 },
        #{ shape: "text", text: "Buffer: " + count + " items", y: 12, color: "#1e293b", font_size: 11, bold: true },
        #{ shape: "rect", w: 90, h: 8, radius: 4, y: -8, bg: "#e2e8f0" },
        #{ shape: "rect", w: bar_w, h: 8, radius: 4, x: (bar_w - 90.0) / 2.0, y: -8, bg: color }
      ]);
    }

graph_defn:
  layout:
    type: hierarchical
    direction: lr
    rank_sep: 240
    node_sep: 110
  graph_attrs:
    title: "Live State Gauges & Buffer Meters"
  node_types:
    - id: client
      fn: *client_fn
      attrs: { ticks: 4 }
    - id: worker
      fn: *worker_fn
      attrs: { ticks: 3 }
  graph:
    - name: client
      node_type: client
      links: [worker]
    - name: worker
      node_type: worker
      links: []
