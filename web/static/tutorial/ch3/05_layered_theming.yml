fns:
  - &leader_fn |
      fn on_init() {
        globals.seq = 0;
      }
      fn on_timer() {
        globals.seq += 1;
        send("follower_1", #{ type: "HEARTBEAT", term: 4, seq: globals.seq, display: "APPEND_ENTRIES #" + globals.seq });
        send("follower_2", #{ type: "HEARTBEAT", term: 4, seq: globals.seq, display: "APPEND_ENTRIES #" + globals.seq });
      }

  - &follower_fn |
      fn on_init() {}
      fn on_msg(msg) {
        send(msg.from, #{ type: "HEARTBEAT_ACK", term: 4, display: "ACK_OK" });
      }

graph_defn:
  graph:
    - name: raft_leader
      node_type: leader
      links: [follower_1, follower_2]
    - name: follower_1
      node_type: follower
      links: [raft_leader]
    - name: follower_2
      node_type: follower
      links: [raft_leader]

  graph_attrs:
    title: Layered & Composed Themes

  icons:
    - id: server_icon
      url: https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.1/assets/72x72/1f5a5.png

  node_templates:
    - id: cluster_card
      params: [node_name, icon, role_label, border_color]
      shapes:
        - shape: roundedrect
          x: 0
          y: 0
          w: 116
          h: 60
          radius: 8
          fill: "#0f172a"
          stroke: "{{border_color}}"
          stroke_width: 1.5

        - shape: icon
          x: -32
          y: 0
          w: 24
          h: 24
          icon: "{{icon}}"

        - shape: text
          x: 16
          y: 8
          text: "{{node_name}}"
          size: 9.5
          color: "#f8fafc"

        - shape: text
          x: 16
          y: -8
          text: "{{role_label}}"
          size: 7.5
          color: "#94a3b8"

  node_types:
    - id: leader
      fn: *leader_fn
      attrs:
        ticks: 2
        icon: server_icon
        template_ref: cluster_card
        template_params:
          node_name: "Leader Node"
          border_color: "#eab308"
          role_label: "LEADER (TERM 4)"
        # Layered on top of the base cluster_card template
        template:
          # Golden outer aura / halo
          - shape: roundedrect
            x: 0
            y: 0
            w: 122
            h: 66
            radius: 10
            stroke: "#eab308"
            stroke_width: 1
            opacity: 0.5
          # Top-right Golden Leader Crown Badge
          - shape: circle
            x: 50
            y: 24
            r: 9
            fill: "#eab308"
          - shape: polygon
            points:
              - [45, 21]
              - [47, 26]
              - [50, 23]
              - [53, 26]
              - [55, 21]
            closed: true
            fill: "#0f172a"
          # Leader Heartbeat Timer Ring around its icon
          - shape: progress
            style: ring
            x: -32
            y: 0
            r: 18
            thickness: 2
            track_color: "#1e293b"
            fill_color: "#eab308"
            start_angle: 90
            clockwise: true

    - id: follower
      fn: *follower_fn
      attrs:
        ticks: 3600
        icon: server_icon
        template_ref: cluster_card
        template_params:
          node_name: "Replica Node"
          border_color: "#334155"
          role_label: "FOLLOWER (SYNC)"
