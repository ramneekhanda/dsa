fns:
  - &core_fn |
      fn on_init() {
        globals.seq = 1;
      }
      fn on_timer() {
        globals.seq += 1;
        send("firewall", #{ op: "SYNC_CIPHER", key: globals.seq, display: "CIPHER #" + globals.seq });
      }

  - &firewall_fn |
      fn on_init() {}
      fn on_msg(msg) {
        send("uplink", #{ op: "BEAM_BURST", key: msg.key, display: "PAYLOAD VERIFIED" });
      }

  - &uplink_fn |
      fn on_init() {}
      fn on_msg(msg) {
        send("ai_core", #{ op: "ACK_DOWNLINK", key: msg.key, display: "LINK ACK" });
      }

graph_defn:
  graph:
    - name: ai_core
      node_type: neural_core
      links: [firewall]
    - name: firewall
      node_type: sentinel_firewall
      links: [uplink]
    - name: uplink
      node_type: orbital_uplink
      links: [ai_core]

  graph_attrs:
    title: Cyberpunk Neon HUD Theme

  icons:
    - id: brain_icon
      url: https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.1/assets/72x72/1f9e0.png
    - id: shield_icon
      url: https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.1/assets/72x72/1f6e1.png
    - id: sat_icon
      url: https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.1/assets/72x72/1f4e1.png

  node_templates:
    - id: cyber_hud
      params: [node_name, icon, neon_border, neon_accent, telemetry, badge_bg, badge_color, status_code]
      shapes:
        # Chamfered polygon dark plate
        - shape: polygon
          points:
            - [-48, 32]
            - [48, 32]
            - [60, 20]
            - [60, -20]
            - [48, -32]
            - [-48, -32]
            - [-60, -20]
            - [-60, 20]
          closed: true
          fill: "#090d16"
          stroke: "{{neon_border}}"
          stroke_width: 1.5

        # Glowing neon runner line
        - shape: line
          x1: -32
          y1: 26
          x2: 32
          y2: 26
          stroke: "{{neon_accent}}"
          stroke_width: 2

        # Icon HUD circle reticle
        - shape: circle
          x: -38
          y: 0
          r: 13
          fill: "#0f172a"
          stroke: "{{neon_accent}}"
          stroke_width: 1.2
        - shape: icon
          x: -38
          y: 0
          w: 18
          h: 18
          icon: "{{icon}}"

        # Node identifier and telemetry info
        - shape: text
          x: 12
          y: 6
          text: "{{node_name}}"
          size: 9.5
          color: "#f0fdf4"
        - shape: text
          x: 12
          y: -6
          text: "{{telemetry}}"
          size: 7.5
          color: "{{neon_accent}}"

        # Telemetry status pill
        - shape: roundedrect
          x: 0
          y: -18
          w: 86
          h: 10
          radius: 2
          fill: "{{badge_bg}}"
        - shape: text
          x: 0
          y: -18
          text: "{{status_code}}"
          size: 6.5
          color: "{{badge_color}}"

        # Cyberpunk Segmented LED Timer Meter
        - shape: progress
          style: segmented
          x: 0
          y: -26
          w: 64
          h: 3
          segments: 6
          gap: 2
          track_color: "#0f172a"
          fill_color: "{{neon_accent}}"

  node_types:
    - id: neural_core
      fn: *core_fn
      attrs:
        ticks: 3
        icon: brain_icon
        template_ref: cyber_hud
        template_params:
          node_name: "CYBER_CORE"
          neon_border: "#00f5ff"
          neon_accent: "#00f5ff"
          telemetry: "NEURAL-BUS // v4"
          badge_bg: "#083344"
          badge_color: "#67e8f9"
          status_code: "SYSTEM // ONLINE"

    - id: sentinel_firewall
      fn: *firewall_fn
      attrs:
        ticks: 3600
        icon: shield_icon
        template_ref: cyber_hud
        template_params:
          node_name: "FIREWALL-01"
          neon_border: "#ff0055"
          neon_accent: "#ff0055"
          telemetry: "PORT 8080 // SECURE"
          badge_bg: "#4c0519"
          badge_color: "#fda4af"
          status_code: "THREAT // ZERO"

    - id: orbital_uplink
      fn: *uplink_fn
      attrs:
        ticks: 3600
        icon: sat_icon
        template_ref: cyber_hud
        template_params:
          node_name: "ORBIT_UPLINK"
          neon_border: "#ffb703"
          neon_accent: "#ffb703"
          telemetry: "BAND // 128.4 GHz"
          badge_bg: "#451a03"
          badge_color: "#fde047"
          status_code: "LINK // LOCKED"
