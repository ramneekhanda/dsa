imports:
  - from: "plibs:synthwave"
  - from: "stdlib:load_balancer"

graph_defn:
  graph_attrs:
    title: "Synthwave Theme with stdlib Load Balancer"
  graph:
    - name: client
      node_type: client
      links: ["lb"]
    - name: lb
      node_type: round_robin_lb
      links: ["worker_alpha", "worker_beta"]
    - name: worker_alpha
      node_type: worker
      links: []
    - name: worker_beta
      node_type: worker
      links: []

  node_types:
    - id: client
      attrs:
        ticks: 2
        template_ref: synth_card
        params:
          status_text: "CLIENT // INGRESS"
      fn: |
        fn on_init() {
          globals.req_id = 0;
        }
        fn on_timer() {
          globals.req_id += 1;
          if globals.req_id == 1 {
            explain("synth_intro", "Ingress Client: Generating requests on a Synthwave neon cluster! Notice how all nodes, message bubbles, and this callout inherit the synthwave theme.");
          }
          send(links[0], "REQ #" + globals.req_id);
        }

    - id: round_robin_lb
      attrs:
        template_ref: synth_card
        params:
          status_text: "ROUTER // RR_LB"

    - id: worker
      attrs:
        ticks: 5
        template_ref: synth_card
        params:
          status_text: "WORKER // ACTIVE"
      fn: |
        fn on_init() {}
        fn on_timer() {}
        fn on_msg(from, msg) {
          explain("worker_ack", node_name + ": Processing " + msg + " routed by the stdlib load balancer!");
        }
