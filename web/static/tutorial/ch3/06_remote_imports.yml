theme: cyberpunk

imports:
  - from: "stdlib:load_balancer"

graph_defn:
  graph_attrs:
    title: "Cyberpunk Cluster with stdlib Load Balancer"
  graph:
    - name: client
      node_type: client
      links: ["lb"]
    - name: lb
      node_type: round_robin_lb
      links: ["srv1", "srv2"]
    - name: srv1
      node_type: worker
      links: []
    - name: srv2
      node_type: worker
      links: []

  node_types:
    - id: client
      attrs:
        ticks: 2
        template_ref: cyber_hud
      fn: |
        fn on_timer() {
          send(links[0], "GET /api/v1/data");
        }
    - id: worker
      attrs:
        ticks: 1
        template_ref: cyber_hud
      fn: |
        fn on_message(msg) {
          log("Worker processing: " + msg);
        }
