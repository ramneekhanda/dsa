fns:
  - &router_fn |
      fn on_init() {
        globals.pkt_id = 100;
      }
      fn on_timer() {
        globals.pkt_id += 1;
        if random_chance(50) {
          send("compute_01", #{ pkt: globals.pkt_id, display: "FRAME #" + globals.pkt_id });
        } else {
          send("compute_02", #{ pkt: globals.pkt_id, display: "FRAME #" + globals.pkt_id });
        }
      }

  - &compute_fn |
      fn on_init() {}
      fn on_msg(msg) {
        if random_chance(70) {
          send("san_array", #{ op: "WRITE_BLOCK", pkt: msg.pkt, display: "SYNC DMA" });
        } else {
          send("edge_switch", #{ op: "ACK", pkt: msg.pkt, display: "TX OK" });
        }
      }

  - &san_fn |
      fn on_init() {}
      fn on_msg(msg) {
        send(msg.from, #{ op: "FLUSH_OK", pkt: msg.pkt, display: "IO COMPLETE" });
      }

graph_defn:
  graph:
    - name: edge_switch
      node_type: switch_1u
      links: [compute_01, compute_02]
    - name: compute_01
      node_type: compute_blade
      links: [san_array, edge_switch]
    - name: compute_02
      node_type: compute_blade
      links: [san_array, edge_switch]
    - name: san_array
      node_type: storage_san
      links: [compute_01, compute_02]

  graph_attrs:
    title: Datacenter Rack Units

  icons:
    - id: switch_icon
      url: https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.1/assets/72x72/1f500.png
    - id: server_icon
      url: https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.1/assets/72x72/1f5a5.png
    - id: disk_icon
      url: https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.1/assets/72x72/1f4be.png

  node_templates:
    - id: rack_chassis
      params: [node_name, icon, unit_id, led_pwr, led_net, led_act]
      shapes:
        # Main chassis faceplate
        - shape: roundedrect
          x: 0
          y: 0
          w: 136
          h: 44
          radius: 4
          fill: "#1e293b"
          stroke: "#475569"
          stroke_width: 1.5

        # Left & right rack-mount flanges (ears)
        - shape: rect
          x: -64
          y: 0
          w: 8
          h: 44
          fill: "#0f172a"
          stroke: "#334155"
          stroke_width: 1
        - shape: rect
          x: 64
          y: 0
          w: 8
          h: 44
          fill: "#0f172a"
          stroke: "#334155"
          stroke_width: 1

        # Mounting screw holes
        - shape: circle
          x: -64
          y: 13
          r: 2.2
          fill: "#94a3b8"
        - shape: circle
          x: -64
          y: -13
          r: 2.2
          fill: "#94a3b8"
        - shape: circle
          x: 64
          y: 13
          r: 2.2
          fill: "#94a3b8"
        - shape: circle
          x: 64
          y: -13
          r: 2.2
          fill: "#94a3b8"

        # Hardware Icon
        - shape: icon
          x: -40
          y: 0
          w: 22
          h: 22
          icon: "{{icon}}"

        # Unit text and hardware designation
        - shape: text
          x: 3
          y: 6
          text: "{{node_name}}"
          size: 9.5
          color: "#f8fafc"
        - shape: text
          x: 3
          y: -8
          text: "{{unit_id}}"
          size: 7.5
          color: "#94a3b8"

        # Hardware Status LEDs (Power, Net, Storage/Activity)
        - shape: circle
          x: 48
          y: 11
          r: 2.5
          fill: "{{led_pwr}}"
        - shape: circle
          x: 48
          y: 0
          r: 2.5
          fill: "{{led_net}}"
        - shape: circle
          x: 48
          y: -11
          r: 2.5
          fill: "{{led_act}}"

  node_types:
    - id: switch_1u
      fn: *router_fn
      attrs:
        ticks: 2
        icon: switch_icon
        template_ref: rack_chassis
        template_params:
          node_name: "Core Switch"
          unit_id: "1U • 100GbE QSFP"
          led_pwr: "#22c55e"
          led_net: "#38bdf8"
          led_act: "#facc15"

    - id: compute_blade
      fn: *compute_fn
      attrs:
        ticks: 3600
        icon: server_icon
        template_ref: rack_chassis
        template_params:
          node_name: "Compute Blade"
          unit_id: "1U • 128 Core EPYC"
          led_pwr: "#22c55e"
          led_net: "#38bdf8"
          led_act: "#22c55e"

    - id: storage_san
      fn: *san_fn
      attrs:
        ticks: 3600
        icon: disk_icon
        template_ref: rack_chassis
        template_params:
          node_name: "SAN Storage"
          unit_id: "2U • NVMe-oF Pool"
          led_pwr: "#22c55e"
          led_net: "#38bdf8"
          led_act: "#ec4899"
