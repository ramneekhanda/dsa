fns:
  - &gateway_fn |
      fn on_init() {
        globals.req_id = 0;
      }
      fn on_timer() {
        globals.req_id += 1;
        send("auth_service", #{ type: "auth_check", req_id: globals.req_id, display: "REQ #" + globals.req_id });
      }

  - &auth_fn |
      fn on_init() {}
      fn on_msg(msg) {
        send("cache_node", #{ type: "lookup", req_id: msg.req_id, display: "TOKEN OK" });
      }

  - &cache_fn |
      fn on_init() {}
      fn on_msg(msg) {
        if random_chance(60) {
          send("gateway", #{ type: "cache_hit", req_id: msg.req_id, display: "CACHE HIT" });
        } else {
          send("db_master", #{ type: "query", req_id: msg.req_id, display: "CACHE MISS" });
        }
      }

  - &db_fn |
      fn on_init() {}
      fn on_msg(msg) {
        send("cache_node", #{ type: "db_result", req_id: msg.req_id, display: "DB ROW" });
      }

graph_defn:
  graph:
    - name: gateway
      node_type: api_gateway
      links: [auth_service]
    - name: auth_service
      node_type: auth_service
      links: [cache_node]
    - name: cache_node
      node_type: cache_node
      links: [gateway, db_master]
    - name: db_master
      node_type: database
      links: [cache_node]

  graph_attrs:
    title: Cloud Architecture Theme

  icons:
    - id: gateway_icon
      url: https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.1/assets/72x72/1f310.png
    - id: auth_icon
      url: https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.1/assets/72x72/1f510.png
    - id: cache_icon
      url: https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.1/assets/72x72/26a1.png
    - id: db_icon
      url: https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.1/assets/72x72/1f5c4.png

  node_templates:
    - id: cloud_card
      params: [node_name, icon, accent_color, service_type, status_bg, status_color, status_text]
      shapes:
        # Card body
        - shape: roundedrect
          x: 0
          y: 0
          w: 124
          h: 72
          radius: 8
          fill: "#ffffff"
          stroke: "#cbd5e1"
          stroke_width: 1.5

        # Top accent color banner
        - shape: rect
          x: 0
          y: 32
          w: 124
          h: 8
          fill: "{{accent_color}}"

        # Icon circular container & icon
        - shape: circle
          x: -38
          y: 6
          r: 16
          fill: "#f8fafc"
          stroke: "#e2e8f0"
          stroke_width: 1
        - shape: icon
          x: -38
          y: 6
          w: 22
          h: 22
          icon: "{{icon}}"

        # Title and service category
        - shape: text
          x: 14
          y: 12
          text: "{{node_name}}"
          size: 10
          color: "#0f172a"
        - shape: text
          x: 14
          y: -2
          text: "{{service_type}}"
          size: 8
          color: "#64748b"

        # Bottom operational status pill
        - shape: roundedrect
          x: 0
          y: -20
          w: 108
          h: 14
          radius: 4
          fill: "{{status_bg}}"
        - shape: text
          x: 0
          y: -20
          text: "{{status_text}}"
          size: 7.5
          color: "{{status_color}}"

        # Flush bottom timer progress bar matching the card's accent color
        - shape: progress
          style: bar
          x: 0
          y: -34
          w: 124
          h: 4
          track_color: "#f1f5f9"
          fill_color: "{{accent_color}}"

  node_types:
    - id: api_gateway
      fn: *gateway_fn
      attrs:
        ticks: 3
        icon: gateway_icon
        template_ref: cloud_card
        template_params:
          node_name: "API Gateway"
          accent_color: "#f59e0b"
          service_type: "Edge / Ingress"
          status_bg: "#fef3c7"
          status_color: "#92400e"
          status_text: "HEALTHY • 240 RPS"

    - id: auth_service
      fn: *auth_fn
      attrs:
        ticks: 3600
        icon: auth_icon
        template_ref: cloud_card
        template_params:
          node_name: "Auth Service"
          accent_color: "#3b82f6"
          service_type: "Microservice"
          status_bg: "#dbeafe"
          status_color: "#1e40af"
          status_text: "JWT • ACTIVE"

    - id: cache_node
      fn: *cache_fn
      attrs:
        ticks: 3600
        icon: cache_icon
        template_ref: cloud_card
        template_params:
          node_name: "Redis Cache"
          accent_color: "#8b5cf6"
          service_type: "In-Memory Store"
          status_bg: "#ede9fe"
          status_color: "#5b21b6"
          status_text: "HIT RATE 94%"

    - id: database
      fn: *db_fn
      attrs:
        ticks: 3600
        icon: db_icon
        template_ref: cloud_card
        template_params:
          node_name: "PostgreSQL DB"
          accent_color: "#10b981"
          service_type: "Primary Cluster"
          status_bg: "#d1fae5"
          status_color: "#065f46"
          status_text: "SYNCED • MASTER"
