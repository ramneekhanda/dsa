fns:
  - &noop_fn |
      fn on_init() {}
      fn on_timer() {}

graph_defn:
  graph:
    - name: client
      node_type: client
      links: []
    - name: server
      node_type: server
      links: []
  graph_attrs:
    title: Reusable Node Templates
  icons:
    - id: gizmo_icon
      url: https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.1/assets/72x72/2699.png

  # A named, reusable shape list - any node type can pull it in via
  # attrs.template_ref instead of repeating these shapes inline.
  node_templates:
    - id: badge
      shapes:
        - shape: icon
          x: 0
          y: 0
          icon: gizmo_icon
        - shape: roundedrect
          x: 0
          y: -34
          w: 70
          h: 20
          fill: "#1b3a5c"
        - shape: text
          x: 0
          y: -34
          text: "node"
          size: 10
          color: "#ffffff"

  node_types:
    - id: client
      fn: *noop_fn
      attrs:
        ticks: 3600
        template_ref: badge
    - id: server
      fn: *noop_fn
      attrs:
        ticks: 3600
        template_ref: badge
