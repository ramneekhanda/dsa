fns:
  - &client_fn |
      fn on_init() {}
      fn on_timer() {
        send("server", #{ display: "ping" });
      }

  - &server_fn |
      fn on_init() {}
      fn on_msg(msg) {
        send(msg.from, #{ display: "ack" });
      }

graph_defn:
  graph:
    - name: client_a
      node_type: client
      links: [server]
    - name: client_b
      node_type: client
      links: [server]
    - name: server
      node_type: server
      links: []
  graph_attrs:
    title: Parametrized Templates
  icons:
    - id: client_icon
      url: https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.1/assets/72x72/1f4bb.png
    - id: server_icon
      url: https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.1/assets/72x72/1f5a5.png

  # Same "badge" template as chapter 2.3 - but this time the icon and label
  # are {{placeholders}}, not fixed values, so the one definition renders
  # correctly for every node type/instance that uses it.
  node_templates:
    - id: badge
      params: [node_name, icon]
      shapes:
        - shape: icon
          x: 0
          y: 0
          icon: "{{icon}}"
        - shape: roundedrect
          x: 0
          y: -34
          w: 92
          h: 20
          fill: "#1b3a5c"
        - shape: text
          x: 0
          y: -34
          text: "{{node_name}}"
          size: 10
          color: "#ffffff"

  node_types:
    - id: client
      fn: *client_fn
      attrs:
        ticks: { min: 4, max: 7, jitter: true }
        # {{icon}} auto-binds to this attrs.icon; {{node_name}} auto-binds
        # to each node *instance*'s own name - client_a and client_b render
        # correctly despite sharing this one node type/template.
        icon: client_icon
        template_ref: badge
    - id: server
      fn: *server_fn
      attrs:
        ticks: 3600
        icon: server_icon
        template_ref: badge
        # template_params overrides the auto-bound node_name with a
        # friendlier display label - explicit bindings win over the
        # automatic ones.
        template_params:
          node_name: "Primary Server"
