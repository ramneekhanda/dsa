fns:
  - &client_fn |
      fn on_init() {
        state.req_id = 0;
        state.received = 0;
      }
      fn on_timer() {
        state.req_id += 1;
        let path = if state.req_id % 2 == 1 { "/auth" } else { "/data" };
        log("client sending " + path + " request #" + state.req_id);
        send("gateway", #{
          type: "REQ",
          path: path,
          req_id: state.req_id,
          reply_to: "client",
          display: path + " #" + state.req_id,
          icon: "request_icon"
        });
      }
      fn on_msg(msg) {
        if msg.type == "RESP" {
          state.received += 1;
          log("client received response for #" + msg.req_id + " [" + msg.service + "] status=" + msg.status);
        }
      }

  - &gateway_fn |
      fn on_init() {
        state.routed = 0;
      }
      fn on_msg(msg) {
        if msg.type == "REQ" {
          state.routed += 1;
          log("gateway routing " + msg.path + " #" + msg.req_id + " downstream");
          if msg.path == "/auth" {
            send("auth_svc", msg);
          } else {
            send("data_svc", msg);
          }
        } else if msg.type == "RESP" {
          log("gateway returning response #" + msg.req_id + " to " + msg.reply_to);
          send(msg.reply_to, msg);
        }
      }

  - &auth_fn |
      fn on_msg(msg) {
        log("auth_svc verifying token for #" + msg.req_id);
        send(msg.from, #{
          type: "RESP",
          req_id: msg.req_id,
          reply_to: msg.reply_to,
          service: "auth",
          status: 200,
          display: "AUTH OK #" + msg.req_id,
          icon: "auth_icon"
        });
      }

  - &data_fn |
      fn on_msg(msg) {
        log("data_svc fetching records for #" + msg.req_id);
        send(msg.from, #{
          type: "RESP",
          req_id: msg.req_id,
          reply_to: msg.reply_to,
          service: "data",
          status: 200,
          display: "DATA OK #" + msg.req_id,
          icon: "data_icon"
        });
      }

graph_defn:
  graph_attrs:
    title: Multilevel Routing & Reverse Reply Path
  graph:
    - name: client
      node_type: client
      links: [gateway]
    - name: gateway
      node_type: gateway
      links: [auth_svc, data_svc]
    - name: auth_svc
      node_type: auth_service
      links: []
    - name: data_svc
      node_type: data_service
      links: []

  node_types:
    - id: client
      attrs:
        ticks: 5
      fn: *client_fn
    - id: gateway
      attrs:
        ticks: 3600
      fn: *gateway_fn
    - id: auth_service
      attrs:
        ticks: 3600
      fn: *auth_fn
    - id: data_service
      attrs:
        ticks: 3600
      fn: *data_fn

  icons:
    - id: request_icon
      url: https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.1/assets/72x72/2709.png
    - id: auth_icon
      url: https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.1/assets/72x72/1f510.png
    - id: data_icon
      url: https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.1/assets/72x72/1f4be.png
