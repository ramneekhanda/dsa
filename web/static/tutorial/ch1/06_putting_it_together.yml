fns:
  - &client_fn |
      fn on_init() {
        globals.req_id = 0;
        globals.retries = 0;
      }
      fn on_timer() {
        globals.req_id += 1;
        log("client sending request #" + globals.req_id);
        send("server", #{ req_id: globals.req_id, display: "req #" + globals.req_id, icon: "request_icon" });
      }
      fn on_msg(msg) {
        if msg.ok {
          log("client got a reply for #" + msg.req_id);
        } else {
          globals.retries += 1;
          log("client got an error for #" + msg.req_id + " - retrying (" + globals.retries + " so far)");
          send("server", #{ req_id: msg.req_id, display: "retry #" + msg.req_id, icon: "request_icon" });
        }
      }

  - &server_fn |
      fn on_init() {
        globals.served = 0;
      }
      fn on_msg(msg) {
        globals.served += 1;
        // flaky flips a coin each request; unreliable_pct controls the odds.
        let ok = true;
        if flaky {
          ok = !random_chance(unreliable_pct);
        }
        log("server handling #" + msg.req_id + " (" + globals.served + " total, ok=" + ok + ")");
        send("client", #{ req_id: msg.req_id, ok: ok, display: "reply #" + msg.req_id, icon: "response_icon" });
      }

graph_defn:
  graph:
    - name: client
      node_type: client
      links: [server]
    - name: server
      node_type: server
      links: [client]
  graph_attrs:
    title: Putting It Together
  icons:
    - id: request_icon
      url: https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.1/assets/72x72/2709.png
    - id: response_icon
      url: https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.1/assets/72x72/2705.png
  node_types:
    - id: client
      fn: *client_fn
      attrs:
        ticks: { min: 3, max: 5, jitter: true }
    - id: server
      fn: *server_fn
      params:
        - name: flaky
          type: Bool
          default: true
        - name: unreliable_pct
          type: Integer
          default: 25
          min: 0
          max: 100
      attrs:
        ticks: 3600
