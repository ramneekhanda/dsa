fns:
  - &client_fn |
    fn on_init() {
      state.req_id = 0;
      log("Client initialized");
    }
    fn on_timer() {
      state.req_id += 1;
      let path = if state.req_id % 2 == 1 { "/auth" } else { "/data" };
      let req = #{
        type: "REQ",
        path: path,
        req_id: state.req_id,
        reply_to: "client",
        display: path + " #" + state.req_id
      };
      log("Client sending " + path + " request #" + state.req_id);
      send("gateway", req);
    }
    fn on_msg(msg) {
      if msg.type == "RESP" {
        log("Client received response: " + msg.display + " status=" + msg.status);
      }
    }

  - &gateway_fn |
    fn on_msg(msg) {
      if msg.type == "REQ" {
        let dest = if msg.path == "/auth" { "auth_svc" } else { "data_svc" };
        log("Gateway routing " + msg.path + " #" + msg.req_id + " -> " + dest);
        send(dest, msg);
      } else if msg.type == "RESP" {
        log("Gateway relaying response #" + msg.req_id + " back to " + msg.reply_to);
        send(msg.reply_to, msg);
      }
    }

  - &service_fn |
    fn on_msg(msg) {
      if msg.type == "REQ" {
        log("Service handling " + msg.path + " #" + msg.req_id);
        send(msg.from, #{
          type: "RESP",
          req_id: msg.req_id,
          reply_to: msg.reply_to,
          status: 200,
          display: msg.path + " 200 OK"
        });
      }
    }

graph_defn:
  layout:
    type: hierarchical
    direction: lr
    rank_sep: 220
    node_sep: 110
  graph_attrs:
    title: "Multilevel Routing & Reverse Paths"
  node_types:
    - id: client
      fn: *client_fn
      attrs: { ticks: 4 }
    - id: gateway
      fn: *gateway_fn
      attrs: { ticks: 3600 }
    - id: service
      fn: *service_fn
      attrs: { ticks: 3600 }
  graph:
    - name: client
      node_type: client
      links: [gateway]
    - name: gateway
      node_type: gateway
      links: [auth_svc, data_svc]
    - name: auth_svc
      node_type: service
      links: []
    - name: data_svc
      node_type: service
      links: []
