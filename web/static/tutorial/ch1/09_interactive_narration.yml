fns:
  - &client_fn |
      fn on_init() {
        globals.count = 0;
      }
      fn on_timer() {
        globals.count += 1;
        if globals.count == 1 {
          explain("welcome", "Client: Starting the cluster! Every 2 ticks I generate requests and send them downstream to the gateway.");
        }
        send("gateway", #{
          req_id: globals.count,
          display: "REQ #" + globals.count
        });
      }
      fn on_msg(msg) {
        if msg.type == "DONE" {
          log("Client received result for #" + msg.req_id + " from " + msg.worker);
        }
      }

  - &gateway_fn |
      fn on_init() {
        globals.idx = 0;
      }
      fn on_msg(msg) {
        explain("gateway_inspect", "Gateway: Intercepted " + msg.display + "! Distributing across workers in round-robin order.");
        let target = links[globals.idx % links.len()];
        globals.idx += 1;
        send(target, msg);
      }

  - &worker_fn |
      fn on_msg(msg) {
        explain("worker_exec", node_name + ": Received " + msg.display + " from gateway. Processing task and returning ACK!");
        send(msg.from, #{
          type: "DONE",
          req_id: msg.req_id,
          worker: node_name,
          display: "DONE #" + msg.req_id
        });
      }

graph_defn:
  graph_attrs:
    title: Interactive Narration with explain()
  graph:
    - name: client
      node_type: client
      links: [gateway]
    - name: gateway
      node_type: gateway
      links: [worker_1, worker_2]
    - name: worker_1
      node_type: worker
      links: []
    - name: worker_2
      node_type: worker
      links: []

  node_types:
    - id: client
      attrs:
        ticks: 2
      fn: *client_fn
    - id: gateway
      attrs:
        ticks: 1
      fn: *gateway_fn
    - id: worker
      attrs:
        ticks: 1
      fn: *worker_fn
